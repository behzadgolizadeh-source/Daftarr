<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F4F7"><title>مدیریت فروشگاه کاوارو</title><style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: single-column phone app. Sticky title bar, four-tab bar at the bottom, ledger-style rows with double-rule totals. */
:root{
  --font:'Vazirmatn','Noto Sans Arabic',Tahoma,'Segoe UI',system-ui,sans-serif;
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E8ECF2; --ink:#121A26; --muted:#566274; --line:#D7DDE6;
  --accent:#2848A8; --accent-ink:#FFFFFF; --accent-soft:#E2E8F8;
  --debt:#B42318; --debt-soft:#FCE8E5; --ok:#0F7544; --ok-soft:#DFF3E8; --warn:#8A5A00; --warn-soft:#FBEFD2;
  --scrim:rgba(10,16,26,.55);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --surface:#161D28; --surface2:#1F2836; --ink:#E8ECF3; --muted:#9AA6B8; --line:#2A3445;
    --accent:#9DB3F7; --accent-ink:#0E131B; --accent-soft:#1F2A4A;
    --debt:#FF8F80; --debt-soft:#3A1E1B; --ok:#62D69C; --ok-soft:#16301F; --warn:#F2C25C; --warn-soft:#3A2D0E;
    --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface2:#1F2836; --ink:#E8ECF3; --muted:#9AA6B8; --line:#2A3445;
  --accent:#9DB3F7; --accent-ink:#0E131B; --accent-soft:#1F2A4A;
  --debt:#FF8F80; --debt-soft:#3A1E1B; --ok:#62D69C; --ok-soft:#16301F; --warn:#F2C25C; --warn-soft:#3A2D0E;
  --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;direction:rtl;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font-family:inherit}

.in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* title bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}

.ib:hover{background:var(--surface2)}
main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}

/* buttons */
.btn{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.lnk{background:none;border:0;color:var(--accent);font-weight:500;cursor:pointer;padding:6px 4px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* tab bar and dock */
.tabs,.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-top:6px;padding-bottom:6px}
.tab{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12px;cursor:pointer}
.tab.on{color:var(--accent);background:var(--accent-soft);font-weight:700}
.dock .in{display:flex;gap:10px;padding-top:10px;padding-bottom:10px}
.dock .btn.pri{flex:1}

/* summary */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px 18px 16px}
.hero .lbl{font-size:13px;opacity:.88}
.hero .big{display:inline-block;font-size:32px;font-weight:700;line-height:1.35;border-bottom:4px double currentColor;margin-top:4px;padding-bottom:2px;font-variant-numeric:tabular-nums}
.hero .unit{font-size:13px;opacity:.88;margin-top:6px}
.hero.owe{background:var(--debt-soft);color:var(--debt)}
.stack{display:grid;gap:10px}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .lbl{font-size:12.5px;color:var(--muted)}

/* lists */
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h2{font-size:15px;font-weight:700}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-align:start;cursor:pointer;font-size:15px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row .main{flex:1;min-width:0}
.row .name,.row .sub{display:block}
.row .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub.late{color:var(--debt)}
.amt{text-align:end;white-space:nowrap;flex:none}
.amt b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.amt small{display:block;font-size:11.5px;color:var(--muted)}
.debt{color:var(--debt)} .ok{color:var(--ok)} .zero{color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:24px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h2{font-size:17px;text-wrap:balance}
.empty p{color:var(--muted);max-width:60ch}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.note{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:6px 14px;font-size:13.5px}
.note .lnk{color:inherit;text-decoration:underline}

/* search */
.search{position:relative;display:block}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-inline-start:42px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span,.chip button{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer}
.chip input:checked+span,.chip button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
label,.lab{font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}
textarea{min-height:76px;resize:vertical}
.ltr{direction:ltr;text-align:right}
.hint{font-size:12.5px;color:var(--muted);min-height:18px}
.hint.bad{color:var(--debt)}
.pick{justify-content:space-between;width:100%;text-align:start}
.irow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.irow .top{display:flex;gap:8px;align-items:center}
.irow .pr{display:grid;grid-template-columns:84px 1fr;gap:8px}
.irow .lt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.irow output{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tot b{font-size:22px;border-bottom:4px double currentColor;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}

/* statement */
.bal{display:flex;flex-direction:column;gap:2px}
.who{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}

.who .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ent .main{display:flex;flex-direction:column}
.det{padding:4px 14px 14px;border-bottom:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:8px}

.det .li:last-of-type{border-bottom:0}
.det .li small{grid-column:1/-1;color:var(--muted)}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.ov.mid{align-items:center;padding:16px}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:84%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .sh{display:flex;align-items:center;justify-content:space-between}
.plist{overflow:auto;border:1px solid var(--line);border-radius:12px;min-height:80px}
.plist .row{border-radius:0}
.dlg{background:var(--surface);border-radius:16px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.load{color:var(--muted);padding:40px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:640px){.hero .big{font-size:36px}}

.tabs .in{grid-template-columns:repeat(5,1fr);gap:2px}
.tab{font-size:11px;padding:6px 0}
.hlogo{height:34px;width:auto;border-radius:8px;flex:none}
.alert{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--debt-soft);color:var(--debt);border-radius:12px;padding:8px 14px;font-size:13.5px;font-weight:500}
.alert .lnk,.note .lnk{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer}
.note .ib{width:30px;height:30px;color:inherit}
.badge{display:inline-block;margin-inline-start:8px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:500;background:var(--surface2);color:var(--muted);vertical-align:middle}
.badge.red{background:var(--debt);color:#fff}
.row.over{background:var(--debt-soft)}
.row.over .name{color:var(--debt)}
.quick.q2{grid-template-columns:1fr 1fr}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio .stat b{font-size:15px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kvs .kv{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.kvs .kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}.kv b{font-weight:500;text-align:end;overflow-wrap:anywhere}
.kv b.ok{color:var(--ok)}.kv b.debt{color:var(--debt)}
.logoBox{min-height:70px;border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px;background:var(--surface)}
.logoBox img{max-height:90px;max-width:100%;border-radius:8px}
.logoHero{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.logoHero img{height:56px;width:auto;border-radius:10px}.logoHero b{font-size:17px}
.pth{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.pbig{display:flex;justify-content:center}.pbig img{max-height:180px;border-radius:14px}
.row.chk{cursor:pointer}.row.chk input{width:20px;height:20px;flex:none}
.prow input{width:140px;min-height:40px;text-align:end}
.prevBox{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;text-align:center;padding:6px;background:#fff;color:#333;font-size:13px}
.prevBox img{width:100%;height:auto}
a.btn{text-decoration:none}
.irow .top .t{flex:1;min-width:0}
.irow .top .btn.sm{white-space:nowrap}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.lock h1{font-size:20px}.llogo{height:80px;border-radius:14px}
.dots{display:flex;gap:14px;margin:6px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}.dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr}
.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:26px;cursor:pointer}
.sheet{max-height:92%;overflow:auto}
.sheet textarea{width:100%}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
#top{display:flex;flex-direction:column;gap:12px}

<script>
(function(){
"use strict";
/* Jalali (Shamsi) calendar conversion, algorithm after jalaali-js (MIT) */
var JB=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function div(a,b){return ~~(a/b)}
function mod(a,b){return a-~~(a/b)*b}
function jalCal(jy,withoutLeap){
  var bl=JB.length,gy=jy+621,leapJ=-14,jp=JB[0],jm,jump,leap,leapG,march,n,i;
  if(jy<jp||jy>=JB[bl-1])throw new Error('Invalid Jalaali year '+jy);
  for(i=1;i<bl;i+=1){
    jm=JB[i];jump=jm-jp;
    if(jy<jm)break;
    leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);
    jp=jm;
  }
  n=jy-jp;
  leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(withoutLeap)return{gy:gy,march:march};
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;
  leap=mod(mod(n+1,33)-1,4);
  if(leap===-1)leap=4;
  return{leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
  d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j,i,gd,gm,gy;
  j=4*jdn+139361631;
  j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
  i=div(mod(j,1461),4)*5+308;
  gd=div(mod(i,153),5)+1;
  gm=mod(div(i,153),12)+1;
  gy=div(j,1461)-100100+div(8-gm,6);
  return{gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){
  var r=jalCal(jy,true);
  return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;
}
function d2j(jdn){
  var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy,false),jdn1f=g2d(gy,3,r.march),jd,jm,k;
  k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy:jy,jm:jm,jd:jd};}
    k-=186;
  }else{
    jy-=1;k+=179;
    if(r.leap===1)k+=1;
  }
  jm=7+div(k,30);jd=mod(k,30)+1;
  return{jy:jy,jm:jm,jd:jd};
}
function toJalali(gy,gm,gd){return d2j(g2d(gy,gm,gd));}
function toGregorian(jy,jm,jd){return d2g(j2d(jy,jm,jd));}

/* ================= helpers ================= */
const APP='مدیریت فروشگاه کاوارو';
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WEEKDAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const METHODS=['نقد','کارت‌به‌کارت','چک','سایر'];
const ROLES=[['customer','مشتری'],['store','فروشگاه'],['personal','شخصی']];
const PACKS=['','کارتن','گونی','بسته','جعبه'];
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n,w)=>String(n).padStart(w||2,'0');
const toFa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const toEn=s=>String(s).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-0x06F0).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-0x0660);
const num=s=>{s=toEn(s).replace(/[٬,،\s]/g,'').replace(/٫/g,'.');return /^-?(\d+\.?\d*|\.\d+)$/.test(s)?parseFloat(s):NaN;};
const money=n=>toFa(String(Math.round(Math.abs(+n||0))).replace(/\B(?=(\d{3})+(?!\d))/g,'٬'));
const r3=n=>Math.round((+n||0)*1000)/1000;
const fq=n=>toFa(String(r3(n))).replace('.','٫');
const fqL=n=>String(r3(n)).replace('.','/');
const nz=s=>toEn(String(s==null?'':s)).replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[‌‏‎\s]/g,'').toLowerCase();
/* toman -> thousand-toman text in the style of the customer messages: 2.950t, 50t, 737/5t */
function tfmt(n){
  const neg=n<0;n=Math.abs(Math.round(+n||0));
  let ip=Math.floor(n/1000),fr=n%1000;
  let s=String(ip).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  if(fr)s+='/'+String(fr).padStart(3,'0').replace(/0+$/,'');
  return (neg?'-':'')+s+'t';
}

const isoParts=iso=>{const p=iso.split('-');return{y:+p[0],m:+p[1],d:+p[2]};};
const isoToJ=iso=>{const p=isoParts(iso);return toJalali(p.y,p.m,p.d);};
const jToIso=(jy,jm,jd)=>{const g=toGregorian(jy,jm,jd);return pad(g.gy,4)+'-'+pad(g.gm)+'-'+pad(g.gd);};
const isoAdd=(iso,n)=>{const p=isoParts(iso);const g=d2g(g2d(p.y,p.m,p.d)+n);return pad(g.gy,4)+'-'+pad(g.gm)+'-'+pad(g.gd);};
const dayDiff=(a,b)=>{const x=isoParts(a),y=isoParts(b);return g2d(x.y,x.m,x.d)-g2d(y.y,y.m,y.d);};
const todayIso=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fmtDate=iso=>{try{const j=isoToJ(iso);return toFa(j.jd)+' '+MONTHS[j.jm-1]+' '+toFa(j.jy);}catch(e){return String(iso);}};
const fmtNum=iso=>{try{const j=isoToJ(iso);return toFa(j.jy+'/'+pad(j.jm)+'/'+pad(j.jd));}catch(e){return '';}};
const fmtEn=iso=>{try{const j=isoToJ(iso);return j.jy+'/'+pad(j.jm)+'/'+pad(j.jd);}catch(e){return '';}};
const weekday=iso=>{const p=isoParts(iso);return WEEKDAYS[(g2d(p.y,p.m,p.d)%7+2)%7];};
function parseJ(s){
  const m=toEn(s).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3];
  if(mo<1||mo>12||d<1||d>31)return null;
  try{const iso=jToIso(y,mo,d);const j=isoToJ(iso);return(j.jy===y&&j.jm===mo&&j.jd===d)?iso:null;}catch(e){return null;}
}

function derive(){
  const by={};
  S.customers.forEach(c=>{by[c.id]={c:c,inv:[],pay:[],bal:+c.opening||0,sales:0,purch:0,recv:0,out:0,last:null};});
  S.invoices.forEach(i=>{const x=by[i.customerId];if(!x)return;const t=+i.total||0;x.inv.push(i);if(i.kind==='purchase'){x.bal-=t;x.purch+=t;}else{x.bal+=t;x.sales+=t;}});
  S.payments.forEach(p=>{const x=by[p.customerId];if(!x)return;const a=+p.amount||0;x.pay.push(p);if(p.dir==='out'){x.bal+=a;x.out+=a;}else{x.bal-=a;x.recv+=a;if(!x.last||p.date>x.last)x.last=p.date;}});
  const stock={};
  S.products.forEach(p=>{stock[p.id]=+p.opening||0;});
  S.moves.forEach(m=>{if(stock[m.productId]!==undefined)stock[m.productId]+=+m.qty||0;});
  S.invoices.forEach(i=>{if(!by[i.customerId])return;(i.items||[]).forEach(it=>{if(it.pid&&stock[it.pid]!==undefined)stock[it.pid]+=(i.kind==='purchase'?1:-1)*(+it.q||0);});});
  Object.keys(stock).forEach(k=>{stock[k]=r3(stock[k]);});
  const pby={};S.products.forEach(p=>{pby[p.id]=p;});
  return{by:by,list:Object.keys(by).map(k=>by[k]),stock:stock,pby:pby};
}

  return ev;
}

/* ---------- date ranges and summaries ---------- */
function rangeOf(k){
  const t=todayIso();
  if(k==='today')return[t,t,'امروز'];
  if(k==='yday'){const y=isoAdd(t,-1);return[y,y,'دیروز'];}
  if(k==='week')return[isoAdd(t,-6),t,'۷ روز اخیر'];
  if(k==='month'){const j=isoToJ(t);return[jToIso(j.jy,j.jm,1),t,'این ماه'];}
  if(k==='lmonth'){const j=isoToJ(t);const y=j.jm===1?j.jy-1:j.jy,m=j.jm===1?12:j.jm-1;const f=jToIso(y,m,1);const e=isoAdd(jToIso(j.jy,j.jm,1),-1);return[f,e,'ماه قبل'];}
  return['0000-00-00','9999-99-99','همه'];
}
function summarize(f,t){
  const R={sales:0,gross:0,disc:0,purch:0,recv:0,paid:0,profit:0,unc:0,nSale:0,nPurch:0,prod:{},methods:{},invs:[],pays:[]};
  const prow=(it,isP)=>{const k=it.pid||('n:'+it.t);return R.prod[k]||(R.prod[k]={name:it.t,pid:it.pid||'',q:0,rev:0,profit:0,unc:0,bq:0,bv:0});};
  S.invoices.forEach(i=>{
    if(!D.by[i.customerId]||i.date<f||i.date>t)return;
    const items=i.items||[],tot=+i.total||0,sub=invSub(i),disc=+i.discount||0;
    R.invs.push(i);
    if(i.kind==='purchase'){
      R.purch+=tot;R.nPurch++;
      items.forEach(it=>{const r=prow(it);r.bq+=+it.q||0;r.bv+=lineOf(it);});
    }else{
      R.sales+=tot;R.gross+=sub;R.disc+=disc;R.nSale++;
      let costedRev=0,pr=0;
      items.forEach(it=>{
        const line=lineOf(it),r=prow(it);r.q+=+it.q||0;r.rev+=line;
        if(it.cost!=null&&it.cost!==''){const g=Math.round((+it.q||0)*((+it.p||0)-(+it.cost||0)));r.profit+=g;costedRev+=line;pr+=g;}
        else if(it.pid){r.unc++;R.unc++;}
      });
      R.profit+=pr-(sub>0?disc*costedRev/sub:0);
    }
  });
  S.payments.forEach(p=>{
    if(!D.by[p.customerId]||p.date<f||p.date>t)return;
    const a=+p.amount||0;R.pays.push(p);
    const m=p.method||'سایر',row=R.methods[m]||(R.methods[m]={inn:0,out:0});
    if(p.dir==='out'){R.paid+=a;row.out+=a;}else{R.recv+=a;row.inn+=a;}
  });
  return R;
}

/* ---- balance sheet ---- */
function balRows(){
  let L=D.list.filter(x=>balDir==='debtor'?x.bal>0.5:balDir==='creditor'?x.bal<-0.5:true);
  if(balOver)L=L.filter(isOver);
  L=filteredPeople(L,balRole);
  if(balSort==='name')L.sort(byName);
  else if(balSort==='date')L.sort((a,b)=>(a.last||'0000')<(b.last||'0000')?-1:1);
  else L.sort((a,b)=>Math.abs(b.bal)-Math.abs(a.bal));
  return L;
}
function balTop(){
  let rec=0,owe=0,nr=0,no=0;
  D.list.forEach(x=>{if(x.bal>0.5){rec+=x.bal;nr++;}else if(x.bal<-0.5){owe-=x.bal;no++;}});
  const L=balRows(),sum=L.reduce((a,x)=>a+x.bal,0);
  let h='<section class="hero"><div class="lbl">مجموع مطالبات شما از '+toFa(nr)+' نفر</div><div class="big">'+money(rec)+'</div><div class="unit">تومان</div></section>';
  h+='<div class="pair">'+tile('بدهی شما به '+toFa(no)+' نفر',money(owe),'تومان')+tile('تراز خالص',(rec-owe<0?'−':'')+money(rec-owe),'تومان',rec-owe<0?'debt':'ok')+'</div>';
  h+='<div class="chips">'+chip('bdir','debtor','بدهکاران به من',balDir==='debtor')+chip('bdir','creditor','طلبکاران (من بدهکارم)',balDir==='creditor')+chip('bdir','all','همه',balDir==='all')+'</div>';
  h+='<div class="chips">'+chip('brole','all','همه گروه‌ها',balRole==='all')+ROLES.map(r=>chip('brole',r[0],r[1],balRole===r[0])).join('')+'</div>';

  h+='<div class="tot"><span>جمع این فهرست ('+toFa(L.length)+' نفر)</span><b class="'+(sum<0?'ok':'')+'">'+(sum<0?'−':'')+money(sum)+'</b></div>';
  return h;
}

function calcInv(){
  const f=$('#invform');if(!f)return 0;
  let sub=0;
  $$('.irow',f).forEach(r=>{const a=num($('.q',r).value),p=num($('.p',r).value);const lt=(isNaN(a)||isNaN(p))?0:Math.round(a*p);$('output',r).textContent=money(lt);sub+=lt;});
  let d=num($('#disc').value);if(isNaN(d)||d<0)d=0;
  const tot=sub-d;
  $('#sub').textContent=money(sub);
  $('#tot').textContent=(tot<0?'−':'')+money(tot);
  const cid=$('#cid').value,x=D.by[cid],kind=view.kind||'sale',ed=view.ed;
  let pv='';
  if(x){
    let b=x.bal;
    if(ed&&ed.customerId===cid)b-=(ed.kind==='purchase'?-1:1)*(+ed.total||0);
    const after=b+(kind==='purchase'?-1:1)*tot;
    pv='حساب قبلی: '+(b<0?'−':'')+money(b)+' · '+(kind==='purchase'?'مانده پس از فاکتور: ':'قابل پرداخت: ')+(after<0?'−':'')+money(after)+' تومان';
  }
  $('#pv').textContent=pv;
  return {sub:sub,disc:d,tot:tot};
}

/* ================= invoice output & reminders ================= */
function invInfo(inv){
  const x=D.by[inv.customerId];
  const e=x?entries(x).find(k=>k.k==='i'&&k.id===inv.id):null;
  const prev=e?e.before:0,total=+inv.total||0;
  return{x:x,prev:prev,total:total,sub:invSub(inv),disc:+inv.discount||0,payable:prev+total};
}
function bankLines(){
  const s=ST(),L=[];
  if(s.card)L.push('شماره کارت: '+s.card+(s.cardOwner?' به نام '+s.cardOwner:'')+(s.bankName?' ('+s.bankName+')':''));
  if(s.sheba)L.push('شبا: '+s.sheba);
  if(s.nationalId)L.push('کد ملی (برای ثبت چک صیادی): '+s.nationalId);
  return L;
}
function invText(inv){
  const s=ST(),I=invInfo(inv),L=[];
  L.push(s.greeting);
  L.push('فاکتور شما تحویل داده شد:');
  (inv.items||[]).forEach(it=>{
    L.push('* '+it.t+' فی '+tfmt(it.p).slice(0,-1)+' مقدار '+fqL(it.q)+(it.pid?' کیلو ':' ')+tfmt(lineOf(it)));
  });
  L.push('جمع فاکتور : '+tfmt(I.sub));
  if(I.disc)L.push('- تخفیف '+tfmt(I.disc));
  if(Math.abs(I.prev)>=1)L.push((I.prev>0?'+':'-')+'حساب قبلی : '+tfmt(Math.abs(I.prev))+(I.prev<0?' (طلب شما)':''));
  L.push('قابل پرداخت احتراما:');
  L.push(tfmt(I.payable));
  if(s.bankInText){const b=bankLines();if(b.length){L.push('');b.forEach(l=>L.push(l));}}
  if(s.footer)L.push(s.footer);
  return L.join('\n');
}
function reminderText(x){
  const s=ST();
  return String(s.sms).replace(/\{name\}/g,x.c.name).replace(/\{amount\}/g,money(x.bal)+' تومان');
}
function loadImg(src){return new Promise(res=>{if(!src)return res(null);const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
const FONT='Vazirmatn, Tahoma, "Segoe UI", sans-serif';
async function drawInvoice(inv){
  const s=ST(),I=invInfo(inv),W=1080,P=56;
  const logo=await loadImg(s.logo);
  const items=inv.items||[];
  const bank=bankLines();
  const rowH=84;
  let H=P+170+110+70+items.length*rowH+30+(I.disc?64:0)+64+(Math.abs(I.prev)>=1?64:0)+110+(bank.length?(64+bank.length*58):0)+(s.footer?70:0)+P;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');
  c.direction='rtl';c.textBaseline='middle';
  c.fillStyle='#fff';c.fillRect(0,0,W,H);
  const R=W-P,Lx=P;
  const T=(t,x,y,size,w,col,al)=>{c.font=(w||400)+' '+size+'px '+FONT;c.fillStyle=col||'#1f1a17';c.textAlign=al||'right';c.fillText(t,x,y);};
  /* header band */
  c.fillStyle='#3b2a20';c.fillRect(0,0,W,170);
  let tx=R;
  if(logo){const h=110,w=logo.width*h/logo.height,ww=Math.min(w,260),hh=ww*logo.height/logo.width;c.fillStyle='#fff';c.beginPath();if(c.roundRect)c.roundRect(R-ww-16,85-hh/2-8,ww+16,hh+16,14);else c.rect(R-ww-16,85-hh/2-8,ww+16,hh+16);c.fill();c.drawImage(logo,R-ww-8,85-hh/2,ww,hh);tx=R-ww-40;}
  T(s.storeName||'کاوارو',tx,66,46,700,'#fff');
  T('فاکتور فروش شماره '+toFa(inv.no||''),tx,120,30,400,'#e9d9c8');
  T(weekday(inv.date)+' '+fmtDate(inv.date),Lx,66,28,400,'#e9d9c8','left');
  let y=170+60;
  T('مشتری: '+(I.x?I.x.c.name:''),R,y,36,700);
  y+=74;
  /* table head */
  const cName=R,cFee=500,cQty=330,cTot=Lx;
  c.fillStyle='#f1e8de';c.fillRect(P,y-34,W-2*P,68);
  T('کالا',cName-12,y,28,700,'#5a463a');T('فی',cFee,y,28,700,'#5a463a','center');T('مقدار',cQty,y,28,700,'#5a463a','center');T('جمع',cTot+12,y,28,700,'#5a463a','left');
  y+=34;
  items.forEach((it,i)=>{
    y+=rowH/2;
    if(i%2)c.fillStyle='#faf6f1',c.fillRect(P,y-rowH/2,W-2*P,rowH);
    let nm=it.t;c.font='400 30px '+FONT;
    while(c.measureText(nm).width>400&&nm.length>3)nm=nm.slice(0,-1);
    if(nm!==it.t)nm+='…';
    T(nm,cName-12,y,30,400);
    T(tfmt(it.p).slice(0,-1),cFee,y,28,400,'#1f1a17','center');
    T(fqL(it.q)+(it.pid?' کیلو':''),cQty,y,28,400,'#1f1a17','center');
    T(tfmt(lineOf(it)),cTot+12,y,30,700,'#1f1a17','left');
    y+=rowH/2;
  });
  c.strokeStyle='#d8c9ba';c.lineWidth=2;c.beginPath();c.moveTo(P,y+10);c.lineTo(W-P,y+10);c.stroke();
  y+=48;
  const row=(l,v,col,size,w)=>{T(l,R,y,size||32,w||400,col);T(v,Lx,y,size||32,w||700,col,'left');y+=64;};
  row('جمع فاکتور',tfmt(I.sub));
  if(I.disc)row('تخفیف','− '+tfmt(I.disc),'#2e7d4f');
  if(Math.abs(I.prev)>=1)row('حساب قبلی',(I.prev<0?'− ':'')+tfmt(Math.abs(I.prev))+(I.prev<0?' (طلب شما)':''),'#b3261e');
  y+=4;
  c.fillStyle='#3b2a20';c.fillRect(P,y-4,W-2*P,92);
  T('قابل پرداخت',R-24,y+42,38,700,'#fff');T(tfmt(I.payable),Lx+24,y+42,46,700,'#ffd9a0','left');
  y+=130;
  if(bank.length){
    c.fillStyle='#f6f0e9';c.fillRect(P,y-30,W-2*P,bank.length*58+52);
    T('اطلاعات حساب',R-20,y,28,700,'#5a463a');y+=54;
    bank.forEach(l=>{T(l,R-20,y,28,400,'#1f1a17');y+=58;});
    y+=20;
  }
  if(s.footer){T(s.footer,W/2,y+10,26,400,'#6b5a4e','center');}
  return cv;
}
const b64=cv=>cv.toDataURL('image/png').split(',')[1];
async function shareImage(cv,name){
  if(isNative()){
    const FS=nat('Filesystem'),SH=nat('Share');
    if(!FS||!SH)throw new Error('افزونه اشتراک‌گذاری در دسترس نیست');
    const w=await FS.writeFile({path:name,data:b64(cv),directory:'CACHE'});
    try{await SH.share({title:name,url:w.uri,dialogTitle:'ارسال فاکتور'});}
    catch(e){if(/cancel/i.test(String(e&&e.message)))return;throw e;}
    return;
  }
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},5000);
}
async function shareText(text,title){
  if(isNative()){
    const SH=nat('Share');
    if(SH){try{await SH.share({title:title||'پیام',text:text,dialogTitle:'ارسال'});return;}catch(e){if(/cancel/i.test(String(e&&e.message)))return;}}
  }else if(navigator.share){try{await navigator.share({text:text});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  copyText(text);
}
function copyText(t){
  try{navigator.clipboard.writeText(t).then(()=>toast('کپی شد'),()=>toast('کپی نشد'));}catch(e){toast('کپی نشد');}
}

  const o=sheet(title,'<textarea id="ts" style="min-height:190px">'+esc(text)+'</textarea><div class="acts"><a class="btn pri" id="tsms" href="#" data-x="sms">پیامک</a><button class="btn" data-x="share">اشتراک‌گذاری</button><button class="btn" data-x="copy">کپی</button></div>'+(extra||''));
  const cur=()=>$('#ts',o).value;
  o.addEventListener('click',e=>{
    if(e.target===o||e.target.closest('[data-x=close]')){o.remove();return;}
    if(e.target.closest('[data-x=sms]')){e.preventDefault();if(!phone)return shareText(cur());location.href=smsHref(phone,cur());}

  });

function ask(msg,okLabel,fn,safe){
  const o=document.createElement('div');o.className='ov mid';
  o.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true"><p>'+esc(msg)+'</p><div class="acts"><button class="btn" data-x="no">انصراف</button><button class="btn '+(safe?'pri':'dng')+'" data-x="ok">'+esc(okLabel)+'</button></div></div>';
  document.body.appendChild(o);
  o.addEventListener('click',e=>{
    const b=e.target.closest('[data-x]');
    if(e.target===o||(b&&b.dataset.x==='no')){o.remove();return;}
    if(b&&b.dataset.x==='ok'){o.remove();fn();}
  });
  const n=$('[data-x=no]',o);if(n)n.focus();
}
function pickImage(maxSide,type,cb){
  const f=document.createElement('input');f.type='file';f.accept='image/*';f.style.display='none';document.body.appendChild(f);
  f.addEventListener('change',()=>{
    const file=f.files&&f.files[0];f.remove();if(!file)return;
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const k=Math.min(1,maxSide/Math.max(im.width,im.height)),cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));
        const c=cv.getContext('2d');
        if(type==='image/jpeg'){c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);}
        c.drawImage(im,0,0,cv.width,cv.height);
        cb(cv.toDataURL(type,0.82));
      };
      im.onerror=()=>toast('این عکس خوانده نشد.');
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
  f.click();
}

async function saveInv(){

  if(!cid)return toast('شخص را انتخاب کنید.');
  const date=parseJ($('#f-date').value);
  if(!date)return toast('تاریخ معتبر نیست. مثال: ۱۴۰۵/۰۸/۰۹');
  const kind=view.kind==='purchase'?'purchase':'sale';
  const items=[];let bad='';
  $$('.irow').forEach(r=>{
    const t=$('.t',r).value.trim(),a=num($('.q',r).value),p=num($('.p',r).value);
    if(!t&&isNaN(p))return;
    if(!t)bad='نام یکی از ردیف‌ها خالی است.';
    else if(isNaN(a)||a<=0)bad='مقدار «'+t+'» درست نیست.';
    else if(isNaN(p)||p<0)bad='قیمت «'+t+'» را وارد کنید.';
    else{
      const it={t:t,q:a,p:p},pid=r.dataset.pid;
      if(pid&&D.pby[pid]){
        it.pid=pid;
        if(kind==='sale'){
          const c0=r.dataset.cost!==''?+r.dataset.cost:+D.pby[pid].buyPrice;
          if(c0>0)it.cost=c0;
        }
      }
      items.push(it);
    }
  });
  if(bad)return toast(bad);
  if(!items.length)return toast('حداقل یک ردیف کالا وارد کنید.');

  if(c.disc>sub)return toast('تخفیف بیشتر از جمع اقلام است.');
  const total=sub-c.disc;
  if(total<=0)return toast('جمع فاکتور باید بیشتر از صفر باشد.');
  const note=$('#f-note').value.trim();
  const pnEl=$('#paynow');let pn=pnEl?num(pnEl.value):NaN;if(isNaN(pn))pn=0;
  if(pn>total)return toast('مبلغ همراه فاکتور بیشتر از جمع فاکتور است.');
  const id=view.id;
  const ok=await write(async()=>{
    const data={customerId:cid,kind:kind,date:date,items:items,sub:sub,discount:c.disc,total:total,note:note};
    if(id){await db.collection('invoices').doc(id).update(data);}
    else{
      const no=nextNo(kind),now=Date.now();
      data.no=no;data.createdAt=now;
      await db.collection('invoices').add(data);
      if(pn>0)await db.collection('payments').add({customerId:cid,dir:kind==='purchase'?'out':'in',date:date,amount:pn,method:$('#paymeth').value,note:'همراه فاکتور '+toFa(no),createdAt:now+1});
      if(kind==='purchase'){
        const last={};items.forEach(it=>{if(it.pid&&it.q>0)last[it.pid]=it.p;});
        for(const pid of Object.keys(last))if(last[pid]>0)await db.collection('products').doc(pid).update({buyPrice:last[pid]});
      }
    }

    R.pays.forEach(p=>rows.push([fmtEn(p.date),D.by[p.customerId].c.name,p.dir==='out'?'پرداخت':'دریافت',p.method||'',p.amount]));
  }else{
    const x=D.by[rep.cid];if(!x)return toast('ابتدا یک شخص را انتخاب کنید.');

  const d=toEn(el.value).replace(/\D/g,'').slice(0,15);
  el.value=d?money(+d):'';
  if(before!=null&&d){
    let cnt=0,i=0;const v=el.value;
    for(;i<v.length&&cnt<before;i++){if(/[۰-۹]/.test(v.charAt(i)))cnt++;}
    try{el.setSelectionRange(i,i);}catch(e){}
  }
}

/* ================= standalone: local storage, backup, restore ================= */
const BK='dh-backup';
function lastBackupAt(){try{return +localStorage.getItem(BK)||0;}catch(e){return 0;}}
function markBackup(){try{localStorage.setItem(BK,String(Date.now()));}catch(e){}}
const SZ='dh-snooze';
function snoozeBackup(){try{localStorage.setItem(SZ,String(Date.now()+864e5));}catch(e){}}
function snoozedUntil(){try{return +localStorage.getItem(SZ)||0;}catch(e){return 0;}}
function backupDue(){if(!S.customers.length)return false;if(Date.now()<snoozedUntil())return false;const t=lastBackupAt();return !t||Date.now()-t>14*864e5;}

function idbReq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function openIDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('daftar-hesab',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('docs');};
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
    r.onblocked=()=>rej(new Error('blocked'));
  });
}
async function createLocalDB(){
  let idb=null;
  try{if(!window.indexedDB)throw new Error('no idb');idb=await openIDB();}catch(e){idb=null;S.mem=true;}
  const cols={},subs={};COLS.forEach(c=>{cols[c]=new Map();subs[c]=[];});
  if(idb){
    const all=await idbReq(idb.transaction('docs').objectStore('docs').getAll());
    all.forEach(x=>{if(x&&cols[x.col])cols[x.col].set(x.id,x.data);});
  }
  const persist=(op,col,id,data)=>{
    if(!idb)return Promise.resolve();
    return new Promise((res,rej)=>{
      const tx=idb.transaction('docs','readwrite'),st=tx.objectStore('docs'),key=col+'/'+id;
      if(op==='put')st.put({col:col,id:id,data:data},key);else st.delete(key);
      tx.oncomplete=()=>res();
      tx.onerror=()=>rej(tx.error);
      tx.onabort=()=>rej(tx.error||new Error('aborted'));
    });
  };
  const snap=col=>({docs:Array.from(cols[col].entries()).map(e=>({id:e[0],data:()=>e[1]}))});
  const emit=col=>{const s=snap(col);subs[col].forEach(f=>{try{f(s);}catch(e){console.error(e);}});};
  const bad=m=>{const e=new Error(m);e.code='invalid_argument';return e;};
  const clone=o=>JSON.parse(JSON.stringify(o));
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const docRef=(col,id)=>({
    id:id,
    async set(data){const d=clone(data);await persist('put',col,id,d);cols[col].set(id,d);emit(col);},
    async update(data){const cur=cols[col].get(id);if(!cur)throw bad('missing');const d=Object.assign({},cur,clone(data));await persist('put',col,id,d);cols[col].set(id,d);emit(col);},
    async delete(){await persist('del',col,id);cols[col].delete(id);emit(col);}
  });
  const colRef=col=>({
    onSnapshot(next){subs[col].push(next);Promise.resolve().then(()=>next(snap(col)));return()=>{subs[col]=subs[col].filter(f=>f!==next);};},
    doc(id){return docRef(col,id||newId());},
    async add(data){const r=docRef(col,newId());await r.set(data);return r;}
  });
  return{collection(name){if(!cols[name])throw new Error('bad collection');return colRef(name);}};
}

function impPick(){const f=$('#impfile');if(!f)return;f.value='';f.click();}
async function impRead(file){
  let o;
  try{o=JSON.parse(await file.text());}catch(e){return toast('فایل پشتیبان معتبر نیست.');}
  const must=['customers','invoices','payments'],opt=['products','moves','groups','settings'];
  const okM=o&&must.every(c=>Array.isArray(o[c]))&&must.every(c=>o[c].every(r=>r&&typeof r.id==='string'&&r.id));
  if(!okM)return toast('این فایل، پشتیبان این برنامه نیست.');
  const cols=must.concat(opt.filter(c=>Array.isArray(o[c])&&o[c].every(r=>r&&typeof r.id==='string'&&r.id)));
  ask('این پشتیبان شامل '+toFa(o.customers.length)+' شخص، '+toFa(o.invoices.length)+' فاکتور و '+toFa(o.payments.length)+' پرداخت'+(Array.isArray(o.products)?'، '+toFa(o.products.length)+' کالا':'')+' است. با اطلاعات فعلی ادغام می‌شود و موارد هم‌شناسه جایگزین می‌شوند.','بازیابی',()=>{
    write(async()=>{
      for(const c of cols)for(const r of o[c]){const d=Object.assign({},r);delete d.id;await db.collection(c).doc(r.id).set(d);}
    },'بازیابی انجام شد');
  },true);
}

/* ================= native helpers (Android app) ================= */
function isNative(){const c=window.Capacitor;return !!(c&&c.isNativePlatform&&c.isNativePlatform());}
function nat(name){
  const c=window.Capacitor;if(!c)return null;
  if(c.Plugins&&c.Plugins[name])return c.Plugins[name];
  if(c.registerPlugin){try{return c.registerPlugin(name);}catch(e){}}
  return null;
}
function showText(name,text,err){
  const o=document.createElement('div');o.className='ov';
  const why=err&&err.message?' ('+esc(String(err.message).slice(0,90))+')':'';
  o.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="کپی فایل"><div class="sh"><b>'+esc(name)+'</b><button class="ib" data-x="close" aria-label="بستن">'+IC.x+'</button></div><p class="hint">ذخیره مستقیم فایل ممکن نشد'+why+'. متن زیر را کپی کنید و در یک یادداشت یا پیام ذخیره (مثلاً Saved Messages تلگرام) نگه دارید. برای بازیابی، متن را در یک فایل متنی ذخیره و از «بازیابی از پشتیبان» انتخاب کنید.</p><textarea id="stx" readonly style="min-height:160px;direction:ltr;text-align:left;font-size:12px"></textarea><button class="btn pri" data-x="copy">کپی همه</button></div>';
  document.body.appendChild(o);
  const ta=$('#stx',o);ta.value=text;
  o.addEventListener('click',e=>{
    if(e.target===o||e.target.closest('[data-x=close]')){o.remove();return;}
    if(e.target.closest('[data-x=copy]')){
      ta.focus();ta.select();let ok=false;
      try{ok=document.execCommand('copy');}catch(x){}
      if(ok)toast('کپی شد');
      else{try{navigator.clipboard.writeText(text).then(()=>toast('کپی شد'),()=>toast('متن انتخاب شد؛ آن را کپی کنید'));}catch(x){toast('متن انتخاب شد؛ آن را کپی کنید');}}
    }
  });
}
function hookNativeBack(){
  const AP=nat('App');if(!AP||!AP.addListener)return;
  AP.addListener('backButton',()=>{
    if(locked&&ST().pin){if(AP.exitApp)AP.exitApp();return;}
    const ovs=$$('.ov');
    if(ovs.length){ovs[ovs.length-1].remove();return;}
    if(stack.length){fromPop=true;back();fromPop=false;return;}
    if(view.n!=='home'){tab('home');return;}
    if(AP.exitApp)AP.exitApp();
  });
}

/* ================= boot ================= */
(async function boot(){
  render();
  const blobDl=(name,data)=>{
    const isJson=/\.json$/i.test(name);
    const blob=new Blob([data],{type:isJson?'application/json':'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},5000);
  };
  dl={
    async save(o){
      if(isNative()){
        const FS=nat('Filesystem'),SH=nat('Share');
        if(!FS||!SH)throw new Error('افزونه ذخیره فایل در دسترس نیست');
        const w=await FS.writeFile({path:o.filename,data:o.data,directory:'CACHE',encoding:'utf8'});
        if(o.onWritten)o.onWritten();
        try{await SH.share({title:o.filename,url:w.uri,dialogTitle:'ذخیره یا ارسال فایل'});}
        catch(e){if(/cancel/i.test(String(e&&e.message)))throw{code:'declined'};throw e;}
        return;
      }
      blobDl(o.filename,o.data);if(o.onWritten)o.onWritten();
    },
    async download(name,data){
      if(isNative()){
        const FS=nat('Filesystem');
        if(!FS)throw new Error('افزونه ذخیره فایل در دسترس نیست');
        try{if(FS.requestPermissions)await FS.requestPermissions();}catch(e){}
        await FS.writeFile({path:'KavaroBackup/'+name,data:data,directory:'DOCUMENTS',encoding:'utf8',recursive:true});
        return 'ذخیره شد: پوشه Documents ← KavaroBackup';
      }
      blobDl(name,data);return 'دانلود شد';
    }
  };
  const f=document.createElement('input');
  f.type='file';f.id='impfile';f.accept='.json,.txt,application/json,text/plain';f.hidden=true;
  if(isNative())hookNativeBack();
  document.body.appendChild(f);
  f.addEventListener('change',()=>{if(f.files&&f.files[0])impRead(f.files[0]);});
  try{db=await createLocalDB();}catch(e){S.nodb=true;render();return;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  COLS.forEach(name=>{
    db.collection(name).onSnapshot(snap=>{
      if(name==='settings'){const m=snap.docs.find(d=>d.id==='main');S.settings=m?m.data():{};}
      else S[name]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      S.loaded[name]=true;
      onData();
    },e=>{S.err=e;render();});
  });
})();

})();
