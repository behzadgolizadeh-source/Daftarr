}

  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface2:#1F2836; --ink:#E8ECF3; --muted:#9AA6B8; --line:#2A3445;
  --accent:#9DB3F7; --accent-ink:#0E131B; --accent-soft:#1F2A4A;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

.ib:hover{background:var(--surface2)}

/* buttons */
.btn{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}

.btn[disabled]{opacity:.55;cursor:default}
.lnk{background:none;border:0;color:var(--accent);font-weight:500;cursor:pointer;padding:6px 4px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* tab bar and dock */
.tabs,.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-top:6px;padding-bottom:6px}
.tab{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12px;cursor:pointer}
.tab.on{color:var(--accent);background:var(--accent-soft);font-weight:700}
.dock .in{display:flex;gap:10px;padding-top:10px;padding-bottom:10px}
.dock .btn.pri{flex:1}

/* summary */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px 18px 16px}
.hero .lbl{font-size:13px;opacity:.88}
.hero .big{display:inline-block;font-size:32px;font-weight:700;line-height:1.35;border-bottom:4px double currentColor;margin-top:4px;padding-bottom:2px;font-variant-numeric:tabular-nums}
.hero .unit{font-size:13px;opacity:.88;margin-top:6px}
.hero.owe{background:var(--debt-soft);color:var(--debt)}
.stack{display:grid;gap:10px}
.hero.settled{background:var(--ok-soft);color:var(--ok)}
.hero.credit{background:var(--warn-soft);color:var(--warn)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}

.sec{display:flex;align-items:center;justify-content:space-between;gap:8px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-align:start;cursor:pointer;font-size:15px}

.search input{padding-inline-start:42px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}

input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}

.irow .pr{display:grid;grid-template-columns:84px 1fr;gap:8px}
.irow .lt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.irow output{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tot b{font-size:22px;border-bottom:4px double currentColor;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}

/* statement */
.bal{display:flex;flex-direction:column;gap:2px}
.who{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.who h2{font-size:19px}
.who .meta{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.who .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ent .main{display:flex;flex-direction:column}
.det{padding:4px 14px 14px;border-bottom:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.det .li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.det .li:last-of-type{border-bottom:0}
.det .li small{grid-column:1/-1;color:var(--muted)}
.det .acts{display:flex;gap:8px}
.k{font-variant-numeric:tabular-nums}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.ov.mid{align-items:center;padding:16px}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:84%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .sh{display:flex;align-items:center;justify-content:space-between}
.plist{overflow:auto;border:1px solid var(--line);border-radius:12px;min-height:80px}
.plist .row{border-radius:0}
.dlg{background:var(--surface);border-radius:16px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.load{color:var(--muted);padding:40px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:640px){.hero .big{font-size:36px}}

<script>
(function(){
"use strict";
/* Jalali (Shamsi) calendar conversion, algorithm after jalaali-js (MIT) */
var JB=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function div(a,b){return ~~(a/b)}
function mod(a,b){return a-~~(a/b)*b}
function jalCal(jy,withoutLeap){
  var bl=JB.length,gy=jy+621,leapJ=-14,jp=JB[0],jm,jump,leap,leapG,march,n,i;
  if(jy<jp||jy>=JB[bl-1])throw new Error('Invalid Jalaali year '+jy);
  for(i=1;i<bl;i+=1){
    jm=JB[i];jump=jm-jp;
    if(jy<jm)break;
    leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);
    jp=jm;
  }
  n=jy-jp;
  leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(withoutLeap)return{gy:gy,march:march};
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;
  leap=mod(mod(n+1,33)-1,4);
  if(leap===-1)leap=4;
  return{leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
  d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j,i,gd,gm,gy;
  j=4*jdn+139361631;
  j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
  i=div(mod(j,1461),4)*5+308;
  gd=div(mod(i,153),5)+1;
  gm=mod(div(i,153),12)+1;
  gy=div(j,1461)-100100+div(8-gm,6);
  return{gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){
  var r=jalCal(jy,true);
  return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;
}
function d2j(jdn){
  var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy,false),jdn1f=g2d(gy,3,r.march),jd,jm,k;
  k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy:jy,jm:jm,jd:jd};}
    k-=186;
  }else{
    jy-=1;k+=179;
    if(r.leap===1)k+=1;
  }
  jm=7+div(k,30);jd=mod(k,30)+1;
  return{jy:jy,jm:jm,jd:jd};
}
function toJalali(gy,gm,gd){return d2j(g2d(gy,gm,gd));}
function toGregorian(jy,jm,jd){return d2g(j2d(jy,jm,jd));}

/* ================= helpers ================= */
const APP='دفتر حساب مشتریان';
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WEEKDAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const METHODS=['نقد','کارت‌به‌کارت','چک','سایر'];
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n,w)=>String(n).padStart(w||2,'0');
const toFa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const toEn=s=>String(s).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-0x06F0).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-0x0660);
const num=s=>{s=toEn(s).replace(/[٬,،\s]/g,'').replace(/٫/g,'.');return /^-?(\d+\.?\d*|\.\d+)$/.test(s)?parseFloat(s):NaN;};
const money=n=>toFa(String(Math.round(Math.abs(+n||0))).replace(/\B(?=(\d{3})+(?!\d))/g,'٬'));
const fq=n=>toFa(String(n)).replace('.','٫');
const nz=s=>toEn(String(s==null?'':s)).replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[‌‏‎\s]/g,'').toLowerCase();

const isoParts=iso=>{const p=iso.split('-');return{y:+p[0],m:+p[1],d:+p[2]};};
const isoToJ=iso=>{const p=isoParts(iso);return toJalali(p.y,p.m,p.d);};
const jToIso=(jy,jm,jd)=>{const g=toGregorian(jy,jm,jd);return pad(g.gy,4)+'-'+pad(g.gm)+'-'+pad(g.gd);};
const isoAdd=(iso,n)=>{const p=isoParts(iso);const g=d2g(g2d(p.y,p.m,p.d)+n);return pad(g.gy,4)+'-'+pad(g.gm)+'-'+pad(g.gd);};
const dayDiff=(a,b)=>{const x=isoParts(a),y=isoParts(b);return g2d(x.y,x.m,x.d)-g2d(y.y,y.m,y.d);};
const todayIso=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fmtDate=iso=>{try{const j=isoToJ(iso);return toFa(j.jd)+' '+MONTHS[j.jm-1]+' '+toFa(j.jy);}catch(e){return String(iso);}};
const fmtNum=iso=>{try{const j=isoToJ(iso);return toFa(j.jy+'/'+pad(j.jm)+'/'+pad(j.jd));}catch(e){return '';}};
const fmtEn=iso=>{try{const j=isoToJ(iso);return j.jy+'/'+pad(j.jm)+'/'+pad(j.jd);}catch(e){return '';}};
const weekday=iso=>{const p=isoParts(iso);return WEEKDAYS[(g2d(p.y,p.m,p.d)%7+2)%7];};
function parseJ(s){
  const m=toEn(s).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3];
  if(mo<1||mo>12||d<1||d>31)return null;
  try{const iso=jToIso(y,mo,d);const j=isoToJ(iso);return(j.jy===y&&j.jm===mo&&j.jd===d)?iso:null;}catch(e){return null;}
}
const ago=d=>d<=0?'امروز':d===1?'دیروز':d<60?toFa(d)+' روز پیش':toFa(Math.floor(d/30))+' ماه پیش';

const ic=p=>'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const IC={
  back:ic('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  x:ic('<path d="M6 6l12 12M18 6L6 18"/>'),
  search:ic('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'),
  home:ic('<path d="M3 11l9-8 9 8M5 10v10h14V10"/>'),
  users:ic('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.7 4.5 4.5"/>'),
  debt:ic('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),
  more:ic('<path d="M4 7h16M4 12h16M4 17h16"/>')
};
const TABS=[['home','خانه',IC.home],['customers','مشتریان',IC.users],['debtors','بدهکاران',IC.debt],['more','بیشتر',IC.more]];

/* ================= state ================= */
const S={customers:[],invoices:[],payments:[],loaded:{customers:false,invoices:false,payments:false},err:null,slow:false,nodb:false};
let db=null,dl=null,view={n:'home'},stack=[],D=null,q='',sortMode='name',openEnt=null,busy=false,shown=false,toastT=null,slowT=null;
const FORMS=['inv','pay','cust'];
const ready=()=>S.loaded.customers&&S.loaded.invoices&&S.loaded.payments;
const app=$('#app');

function derive(){
  const by={};
  S.customers.forEach(c=>{by[c.id]={c:c,inv:[],pay:[],bal:+c.opening||0,sales:0,paid:0,last:null};});
  S.invoices.forEach(i=>{const x=by[i.customerId];if(!x)return;const t=+i.total||0;x.inv.push(i);x.bal+=t;x.sales+=t;});
  S.payments.forEach(p=>{const x=by[p.customerId];if(!x)return;const a=+p.amount||0;x.pay.push(p);x.bal-=a;x.paid+=a;if(!x.last||p.date>x.last)x.last=p.date;});
  return{by:by,list:Object.keys(by).map(k=>by[k])};
}
function totals(){
  const tj=isoToJ(todayIso());let debt=0,n=0,sales=0,paid=0;
  D.list.forEach(x=>{if(x.bal>0.5){debt+=x.bal;n++;}});
  const inMonth=iso=>{try{const j=isoToJ(iso);return j.jy===tj.jy&&j.jm===tj.jm;}catch(e){return false;}};
  S.invoices.forEach(i=>{if(D.by[i.customerId]&&inMonth(i.date))sales+=+i.total||0;});
  S.payments.forEach(p=>{if(D.by[p.customerId]&&inMonth(p.date))paid+=+p.amount||0;});
  return{debt:debt,n:n,sales:sales,paid:paid,mname:MONTHS[tj.jm-1]};
}

function ledger(x){
  const ev=[];
  if(+x.c.opening)ev.push({k:'o',id:'o',date:'0000-00-00',t:0,amt:+x.c.opening});
  x.inv.forEach(i=>ev.push({k:'i',id:i.id,date:i.date,t:i.createdAt||0,amt:+i.total||0,r:i}));
  x.pay.forEach(p=>ev.push({k:'p',id:p.id,date:p.date,t:p.createdAt||0,amt:-(+p.amount||0),r:p}));
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.t-b.t);
  let run=0;ev.forEach(e=>{run+=e.amt;e.run=run;});
  return ev.reverse();
}

/* ================= feedback ================= */
function toast(m){
  let t=$('#toast');
  if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.textContent=m;t.className='show';clearTimeout(toastT);toastT=setTimeout(()=>{t.className='';},2800);

function ask(msg,okLabel,fn,safe){

/* ================= writes ================= */
function errText(e){
  const c=e&&e.code;
  if(c==='invalid_argument')return 'داده نامعتبر بود و ذخیره نشد.';
  if(c==='quota_exceeded')return 'ظرفیت ذخیره‌سازی پر شده است.';
  if(c==='resource_exhausted')return 'درخواست‌ها زیاد بود. چند لحظه صبر کنید.';
  return 'ذخیره نشد. اتصال را بررسی کنید و دوباره امتحان کنید.';
}
async function write(fn,okMsg){
  if(busy)return false;
  busy=true;
  try{await fn();if(okMsg)toast(okMsg);return true;}
  catch(e){toast(errText(e));return false;}
  finally{busy=false;}
}
async function saveCust(){
  const name=$('#f-name').value.trim();
  if(!name)return toast('نام مشتری را وارد کنید.');
  const o=num($('#f-open').value);
  const dir=($('input[name=od]:checked')||{}).value==='cr'?-1:1;
  const data={name:name,phone:toEn($('#f-phone').value).replace(/[^\d+]/g,''),address:$('#f-addr').value.trim(),note:$('#f-note').value.trim(),opening:(isNaN(o)?0:o)*dir};
  const id=view.id;
  const ok=await write(async()=>{
    if(id)await db.collection('customers').doc(id).update(data);
    else{data.createdAt=Date.now();await db.collection('customers').add(data);}
  },'ذخیره شد');
  if(ok)back();
}
async function saveInv(){
  const cid=$('#cid').value;
  if(!cid)return toast('مشتری را انتخاب کنید.');
  const date=parseJ($('#f-date').value);
  if(!date)return toast('تاریخ معتبر نیست. مثال: ۱۴۰۵/۰۸/۰۹');
  const items=[];let bad='';
  $$('.irow').forEach(r=>{
    const t=$('.t',r).value.trim(),a=num($('.q',r).value),p=num($('.p',r).value);
    if(!t&&isNaN(p))return;
    if(!t)bad='شرح یکی از ردیف‌ها خالی است.';
    else if(isNaN(a)||a<=0)bad='تعداد «'+t+'» درست نیست.';
    else if(isNaN(p)||p<0)bad='قیمت «'+t+'» را وارد کنید.';
    else items.push({t:t,q:a,p:p});
  });
  if(bad)return toast(bad);
  if(!items.length)return toast('حداقل یک ردیف کالا وارد کنید.');
  const total=invTotal(items);
  if(total<=0)return toast('جمع فاکتور باید بیشتر از صفر باشد.');
  const note=$('#f-note').value.trim();
  const pnEl=$('#paynow');let pn=pnEl?num(pnEl.value):NaN;if(isNaN(pn))pn=0;
  if(pn>total)return toast('پرداخت هنگام خرید بیشتر از جمع فاکتور است.');
  const id=view.id;
  const ok=await write(async()=>{
    if(id){await db.collection('invoices').doc(id).update({customerId:cid,date:date,items:items,total:total,note:note});}
    else{
      const no=nextNo(),now=Date.now();
      await db.collection('invoices').add({customerId:cid,no:no,date:date,items:items,total:total,note:note,createdAt:now});
      if(pn>0)await db.collection('payments').add({customerId:cid,date:date,amount:pn,method:$('#paymeth').value,note:'همراه فاکتور '+toFa(no),createdAt:now+1});
    }
  },'فاکتور ذخیره شد');
  if(ok)back();
}
async function savePay(){
  const cid=$('#cid').value;
  if(!cid)return toast('مشتری را انتخاب کنید.');

  },'پرداخت ذخیره شد');

/* ================= events ================= */
function liveMoney(el){
  let pos=null;try{pos=el.selectionStart;}catch(e){}
  const before=pos==null?null:toEn(el.value.slice(0,pos)).replace(/\D/g,'').length;
  const d=toEn(el.value).replace(/\D/g,'').slice(0,15);
  el.value=d?money(+d):'';
  if(before!=null&&d){
    let cnt=0,i=0;const v=el.value;
    for(;i<v.length&&cnt<before;i++){if(/[۰-۹]/.test(v.charAt(i)))cnt++;}
    try{el.setSelectionRange(i,i);}catch(e){}
  }
}

  const t=e.target;

const BK='dh-backup';
function lastBackupAt(){try{return +localStorage.getItem(BK)||0;}catch(e){return 0;}}
function markBackup(){try{localStorage.setItem(BK,String(Date.now()));}catch(e){}}
function backupDue(){if(!S.customers.length)return false;const t=lastBackupAt();return !t||Date.now()-t>14*864e5;}

function idbReq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function openIDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('daftar-hesab',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('docs');};
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
    r.onblocked=()=>rej(new Error('blocked'));
  });
}
async function createLocalDB(){
  let idb=null;
  try{if(!window.indexedDB)throw new Error('no idb');idb=await openIDB();}catch(e){idb=null;S.mem=true;}
  const cols={customers:new Map(),invoices:new Map(),payments:new Map()};
  const subs={customers:[],invoices:[],payments:[]};
  if(idb){
    const all=await idbReq(idb.transaction('docs').objectStore('docs').getAll());
    all.forEach(x=>{if(x&&cols[x.col])cols[x.col].set(x.id,x.data);});
  }
  const persist=(op,col,id,data)=>{
    if(!idb)return Promise.resolve();
    return new Promise((res,rej)=>{
      const tx=idb.transaction('docs','readwrite'),st=tx.objectStore('docs'),key=col+'/'+id;
      if(op==='put')st.put({col:col,id:id,data:data},key);else st.delete(key);
      tx.oncomplete=()=>res();
      tx.onerror=()=>rej(tx.error);
      tx.onabort=()=>rej(tx.error||new Error('aborted'));
    });
  };
  const snap=col=>({docs:Array.from(cols[col].entries()).map(e=>({id:e[0],data:()=>e[1]}))});
  const emit=col=>{const s=snap(col);subs[col].forEach(f=>{try{f(s);}catch(e){console.error(e);}});};
  const bad=m=>{const e=new Error(m);e.code='invalid_argument';return e;};
  const clone=o=>JSON.parse(JSON.stringify(o));
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const docRef=(col,id)=>({
    id:id,
    async set(data){const d=clone(data);await persist('put',col,id,d);cols[col].set(id,d);emit(col);},
    async update(data){const cur=cols[col].get(id);if(!cur)throw bad('missing');const d=Object.assign({},cur,clone(data));await persist('put',col,id,d);cols[col].set(id,d);emit(col);},
    async delete(){await persist('del',col,id);cols[col].delete(id);emit(col);}
  });
  const colRef=col=>({
    onSnapshot(next){subs[col].push(next);Promise.resolve().then(()=>next(snap(col)));return()=>{subs[col]=subs[col].filter(f=>f!==next);};},
    doc(id){return docRef(col,id||newId());},
    async add(data){const r=docRef(col,newId());await r.set(data);return r;}
  });
  return{collection(name){if(!cols[name])throw new Error('bad collection');return colRef(name);}};
}

function impPick(){const f=$('#impfile');if(!f)return;f.value='';f.click();}
async function impRead(file){
  let o;
  try{o=JSON.parse(await file.text());}catch(e){return toast('فایل پشتیبان معتبر نیست.');}
  const cols=['customers','invoices','payments'];
  const ok=o&&cols.every(c=>Array.isArray(o[c]))&&cols.every(c=>o[c].every(r=>r&&typeof r.id==='string'&&r.id));
  if(!ok)return toast('این فایل، پشتیبان این برنامه نیست.');
  ask('این پشتیبان شامل '+toFa(o.customers.length)+' مشتری، '+toFa(o.invoices.length)+' فاکتور و '+toFa(o.payments.length)+' پرداخت است. با اطلاعات فعلی ادغام می‌شود و موارد هم‌شناسه جایگزین می‌شوند.','بازیابی',()=>{
    write(async()=>{
      for(const c of cols)for(const r of o[c]){const d=Object.assign({},r);delete d.id;await db.collection(c).doc(r.id).set(d);}
    },'بازیابی انجام شد');
  },true);
}

/* ================= native helpers (Android app) ================= */
function isNative(){const c=window.Capacitor;return !!(c&&c.isNativePlatform&&c.isNativePlatform());}
function nat(name){
  const c=window.Capacitor;if(!c)return null;
  if(c.Plugins&&c.Plugins[name])return c.Plugins[name];
  if(c.registerPlugin){try{return c.registerPlugin(name);}catch(e){}}
  return null;
}
function showText(name,text,err){
  const o=document.createElement('div');o.className='ov';
  const why=err&&err.message?' ('+esc(String(err.message).slice(0,90))+')':'';
  o.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="کپی فایل"><div class="sh"><b>'+esc(name)+'</b><button class="ib" data-x="close" aria-label="بستن">'+IC.x+'</button></div><p class="hint">ذخیره مستقیم فایل ممکن نشد'+why+'. متن زیر را کپی کنید و در یک یادداشت یا پیام ذخیره (مثلاً Saved Messages تلگرام) نگه دارید. برای بازیابی، متن را در یک فایل متنی ذخیره و از «بازیابی از پشتیبان» انتخاب کنید.</p><textarea id="stx" readonly style="min-height:160px;direction:ltr;text-align:left;font-size:12px"></textarea><button class="btn pri" data-x="copy">کپی همه</button></div>';
  document.body.appendChild(o);
  const ta=$('#stx',o);ta.value=text;
  o.addEventListener('click',e=>{
    if(e.target===o||e.target.closest('[data-x=close]')){o.remove();return;}
    if(e.target.closest('[data-x=copy]')){
      ta.focus();ta.select();let ok=false;
      try{ok=document.execCommand('copy');}catch(x){}
      if(ok)toast('کپی شد');
      else{try{navigator.clipboard.writeText(text).then(()=>toast('کپی شد'),()=>toast('متن انتخاب شد؛ آن را کپی کنید'));}catch(x){toast('متن انتخاب شد؛ آن را کپی کنید');}}
    }
  });
}
function hookNativeBack(){
  const AP=nat('App');if(!AP||!AP.addListener)return;
  AP.addListener('backButton',()=>{
    const ovs=$$('.ov');
    if(ovs.length){ovs[ovs.length-1].remove();return;}
    if(stack.length){fromPop=true;back();fromPop=false;return;}
    if(view.n!=='home'){tab('home');return;}
    if(AP.exitApp)AP.exitApp();
  });
}

/* ================= boot ================= */
(async function boot(){
  render();
  dl={async save(o){
    const cap=window.Capacitor;
    if(cap&&cap.isNativePlatform&&cap.isNativePlatform()){
      const FS=nat('Filesystem'),SH=nat('Share');
      if(!FS||!SH)throw new Error('افزونه ذخیره فایل در دسترس نیست');
      const w=await FS.writeFile({path:o.filename,data:o.data,directory:'CACHE',encoding:'utf8'});
      try{await SH.share({title:o.filename,url:w.uri,dialogTitle:'ذخیره یا ارسال فایل'});}
      catch(e){if(/cancel/i.test(String(e&&e.message)))throw{code:'declined'};throw e;}
      return;
    }
    const isJson=/\.json$/i.test(o.filename);
    const blob=new Blob([o.data],{type:isJson?'application/json':'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=o.filename;a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},5000);
  }};
  const f=document.createElement('input');
  f.type='file';f.id='impfile';f.accept='.json,.txt,application/json,text/plain';f.hidden=true;
  if(isNative())hookNativeBack();
  document.body.appendChild(f);
  f.addEventListener('change',()=>{if(f.files&&f.files[0])impRead(f.files[0]);});
  try{db=await createLocalDB();}catch(e){S.nodb=true;render();return;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  ['customers','invoices','payments'].forEach(name=>{
    db.collection(name).onSnapshot(snap=>{
      S[name]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      S.loaded[name]=true;
      onData();
    },e=>{S.err=e;render();});
  });
})();

})();
