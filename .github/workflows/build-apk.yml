name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web folder
        run: |
          mkdir www
          cp index.html www/index.html
      - name: Install packages
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Apply app icon
        run: |
          ICON=$(ls | grep -i '^icon\.png$' | head -n 1)
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              mkdir -p android/app/src/main/res/mipmap-$d
              cp "$ICON" android/app/src/main/res/mipmap-$d/$n.png
            done
          done
      - name: Sync web files
        run: npx cap sync android
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk daftar-hesab.apk
      - name: Keep as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: daftar-hesab-apk
          path: daftar-hesab.apk
      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Daftar Hesab ${{ github.run_number }}
          files: daftar-hesab.apk
